name: Call Secure PR Gate

# 이 저장소의 PR에서 reusable workflow를 호출하는 얇은 caller.
# 다른 프로젝트는 examples/caller-security-gate.yml 을 참고해 동일 패턴으로 연동한다.
on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  secure-pr-gate:
    uses: ./.github/workflows/pr-security-gate.yml
    with:
      # 개발/PR 검증: 워크플로우와 동일한 커밋의 scripts/policy 사용
      gate_repository: ${{ github.repository }}
      gate_ref: ${{ github.sha }}
      enable_dast: false
      # runner-local DAST 예시 (앱 기동 명령이 있을 때 활성화):
      # enable_dast: true
      # install_command: npm ci
      # build_command: npm run build
      # start_command: npm start
      # app_port: "3000"
      # health_path: /health
      # Trivy image 분기 / Dependency-Track (선택):
      # dockerfile_path: Dockerfile
      # docker_build_context: .
      # dependency_track_service_name: backend   # 모노레포 서비스명 (비우면 레포 단위)
      # dependency_track_project_version: main
      # dependency_track_upload_mode: main-only  # PR에서는 skip, main push에서 업로드
      # secrets: DEPENDENCY_TRACK_URL (Backend API), DEPENDENCY_TRACK_API_KEY
      # 상세: docs/dependency-track.md
    secrets: inherit
