name: PR Security Gate

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  # ──────────────────────────────────────────
  # 1. Build / Test
  # ──────────────────────────────────────────
  build-test:
    name: Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Build and Test"
        run: |
          echo "Build and Test placeholder - replace with actual build/test commands"
          mkdir -p security/reports
          cat > security/reports/build-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "build-test",
            "findings": []
          }
          EOF

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: security/reports/build-report.json

  # ──────────────────────────────────────────
  # 2. SAST (Semgrep) - C파트 연결 예정
  # ──────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] SAST Scan"
        run: |
          echo "SAST placeholder - C파트의 Semgrep 명령어로 교체 예정"
          mkdir -p security/reports
          cat > security/reports/sast-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "semgrep",
            "findings": []
          }
          EOF

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: security/reports/sast-report.json

  # ──────────────────────────────────────────
  # 3. Secret Scan (Gitleaks) - C파트 연결 예정
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Secret Scan"
        run: |
          echo "Secret Scan placeholder - C파트의 Gitleaks 명령어로 교체 예정"
          mkdir -p security/reports
          cat > security/reports/secret-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "gitleaks",
            "findings": []
          }
          EOF

      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        with:
          name: secret-report
          path: security/reports/secret-report.json

  # ──────────────────────────────────────────
  # 4. Dependency Scan (Trivy) - C파트 연결 예정
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Dependency Scan"
        run: |
          echo "Dependency Scan placeholder - C파트의 Trivy 명령어로 교체 예정"
          mkdir -p security/reports
          cat > security/reports/dependency-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "trivy",
            "findings": []
          }
          EOF

      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: security/reports/dependency-report.json

  # ──────────────────────────────────────────
  # 5. Runtime Validation - D파트
  # ──────────────────────────────────────────
  runtime-validation:
    name: Runtime Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP Baseline
        env:
          ZAP_TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
          RUNTIME_BASE_URL: ${{ vars.RUNTIME_BASE_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          TARGET_URL="${ZAP_TARGET_URL:-${RUNTIME_BASE_URL:-$STAGING_URL}}"
          if [ -z "$TARGET_URL" ]; then
            echo "ZAP_TARGET_URL/RUNTIME_BASE_URL/STAGING_URL is not set. Skipping ZAP baseline."
            exit 0
          fi

          mkdir -p security/reports
          docker run --rm \
            -v "${{ github.workspace }}/security/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$TARGET_URL" \
            -J zap-report.json || true

      - name: Run Runtime Validation
        env:
          RUNTIME_BASE_URL: ${{ vars.RUNTIME_BASE_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          HEALTH_CHECK_PATH: ${{ vars.HEALTH_CHECK_PATH }}
          HEALTH_EXPECTED_STATUS: ${{ vars.HEALTH_EXPECTED_STATUS }}
          SMOKE_TEST_PATHS: ${{ vars.SMOKE_TEST_PATHS }}
          REQUIRED_SECURITY_HEADERS: ${{ vars.REQUIRED_SECURITY_HEADERS }}
          ZAP_REPORT_PATH: security/reports/zap-report.json
        run: python scripts/runtime-validation.py

      - name: Upload runtime validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-report
          path: security/reports/runtime-report.json

  # ──────────────────────────────────────────
  # 6. Aggregate & Gate Evaluation
  # ──────────────────────────────────────────
  aggregate-and-gate:
    name: Aggregate & Gate Evaluation
    runs-on: ubuntu-latest
    needs: [build-test, sast, secret-scan, dependency-scan, runtime-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Aggregator
        run: python scripts/aggregate-results.py

      - name: Run Gate Evaluator
        id: gate-eval
        run: python scripts/evaluate-gate.py
        continue-on-error: true

      - name: Upload gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-decision
          path: |
            security/reports/security-summary.json
            security/reports/gate-decision.json

      - name: Enforce Gate
        if: steps.gate-eval.outcome == 'failure'
        run: |
          echo "Security Gate FAILED - Merge is blocked."
          exit 1

  # ──────────────────────────────────────────
  # 7. PR Comment
  # ──────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: aggregate-and-gate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download gate decision
        uses: actions/download-artifact@v4
        with:
          name: gate-decision
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/create-pr-comment.py
