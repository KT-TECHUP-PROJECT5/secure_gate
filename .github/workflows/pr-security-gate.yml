name: Secure PR Gate

# Reusable workflow — 다른 저장소(또는 이 저장소의 caller)가 uses: 로 호출한다.
# 스스로 pull_request 이벤트를 받지 않는다.
on:
  workflow_call:
    inputs:
      gate_repository:
        description: Secure PR Gate tooling repository (scripts, default policy)
        type: string
        required: false
        default: "KT-TECHUP-PROJECT5/secure_gate"
      gate_ref:
        description: Ref/tag of Secure PR Gate tooling to checkout
        type: string
        required: false
        default: "v1"
      enable_dast:
        description: Run DAST against a started app (requires start_command or target_url)
        type: boolean
        required: false
        default: false
      install_command:
        description: Dependency install command for runner-local runtime (e.g. npm ci)
        type: string
        required: false
        default: ""
      build_command:
        description: Build command for runner-local runtime (e.g. npm run build)
        type: string
        required: false
        default: ""
      start_command:
        description: Start command for runner-local runtime (e.g. npm start)
        type: string
        required: false
        default: ""
      app_port:
        description: Port where the app listens in runner-local mode
        type: string
        required: false
        default: "3000"
      health_path:
        description: Health check path
        type: string
        required: false
        default: "/health"
      target_url:
        description: External Preview/Staging URL for DAST (overrides localhost when set)
        type: string
        required: false
        default: ""
      policy_path:
        description: Policy file path relative to caller repo (empty = use Secure Gate default)
        type: string
        required: false
        default: ""
      node_version:
        description: Node.js version when install/build/start commands are used
        type: string
        required: false
        default: "20"
      dockerfile_path:
        description: Dockerfile path relative to caller repository (empty = auto-detect root Dockerfile/dockerfile only)
        type: string
        required: false
        default: ""
      docker_build_context:
        description: Docker build context path relative to caller repository
        type: string
        required: false
        default: "."
      dependency_track_service_name:
        description: Monorepo deployable unit (e.g. frontend/backend). Empty = whole-repo DT project
        type: string
        required: false
        default: ""
      dependency_track_project_version:
        description: Dependency-Track project version (default main; DT is managed on main)
        type: string
        required: false
        default: "main"
      dependency_track_upload_mode:
        description: When to upload SBOM to DT (main-only | always | never)
        type: string
        required: false
        default: "main-only"
    secrets:
      DEPENDENCY_TRACK_URL:
        description: Dependency-Track Backend API base URL (not UI-only URL)
        required: false
      DEPENDENCY_TRACK_API_KEY:
        description: Dependency-Track API Key for BOM upload
        required: false

jobs:
  # ──────────────────────────────────────────
  # 1. Build / Test
  # ──────────────────────────────────────────
  build-test:
    name: Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: "[Placeholder] Build and Test"
        run: |
          echo "Build and Test placeholder - replace with actual build/test commands"
          if [ -n "${{ inputs.build_command }}" ]; then
            echo "Configured build_command: ${{ inputs.build_command }}"
          fi
          mkdir -p security/reports
          cat > security/reports/build-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "build-test",
            "findings": []
          }
          EOF

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: security/reports/build-report.json

  # ──────────────────────────────────────────
  # 2. SAST (Semgrep) - C파트
  # ──────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.168.0

      - name: Run Semgrep
        id: semgrep-scan
        run: |
          mkdir -p security/reports
          semgrep scan \
            --config auto \
            --config r/python.flask.security.xss.audit.template-unescaped-with-safe.template-unescaped-with-safe \
            . \
            --json \
            --output security/reports/sast-report.json

      - name: Validate Semgrep report
        run: |
          python -c 'import json; data=json.load(open("security/reports/sast-report.json")); assert isinstance(data.get("results"), list); assert isinstance(data.get("errors"), list)'

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: security/reports/sast-report.json

  # ──────────────────────────────────────────
  # 3. Secret Scan (Gitleaks) - C파트
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        id: gitleaks-scan
        run: |
          mkdir -p security/reports
          gitleaks git . \
            --report-format json \
            --report-path security/reports/secret-report.json \
            --redact=100 \
            --exit-code 0 \
            --no-banner

      - name: Validate Gitleaks report
        run: |
          python3 -c 'import json; data=json.load(open("security/reports/secret-report.json")); assert isinstance(data, list)'

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-report
          path: security/reports/secret-report.json

  # ──────────────────────────────────────────
  # 4. Dependency Scan (Trivy) - C파트
  # CVE JSON → Gate / CycloneDX SBOM → DT (optional UUID upload)
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.70.0"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

      - name: Resolve Dockerfile and scan mode
        id: resolve-dockerfile
        run: |
          set -euo pipefail
          INPUT_PATH="${{ inputs.dockerfile_path }}"
          CONTEXT="${{ inputs.docker_build_context }}"
          DOCKERFILE=""

          if [ -n "$INPUT_PATH" ]; then
            if [ ! -f "$INPUT_PATH" ]; then
              echo "dockerfile_path was set but file not found: $INPUT_PATH"
              exit 1
            fi
            DOCKERFILE="$INPUT_PATH"
          elif [ -f "Dockerfile" ]; then
            DOCKERFILE="Dockerfile"
          elif [ -f "dockerfile" ]; then
            DOCKERFILE="dockerfile"
          fi

          if [ -n "$DOCKERFILE" ]; then
            MODE="image"
          else
            MODE="fs"
          fi

          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "context=${CONTEXT}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved Dockerfile: '${DOCKERFILE:-<none>}'"
          echo "Docker build context: '${CONTEXT}'"
          echo "Trivy scan mode: ${MODE}"

      - name: Build image for Trivy (Dockerfile branch)
        if: steps.resolve-dockerfile.outputs.mode == 'image'
        run: |
          set -euo pipefail
          DOCKERFILE="${{ steps.resolve-dockerfile.outputs.dockerfile }}"
          CONTEXT="${{ steps.resolve-dockerfile.outputs.context }}"
          IMAGE_TAG="secure-gate-scan:${{ github.sha }}"
          echo "Building ${IMAGE_TAG} from -f ${DOCKERFILE} ${CONTEXT}"
          docker build -f "${DOCKERFILE}" -t "${IMAGE_TAG}" "${CONTEXT}"

      - name: Run Trivy CVE scan
        id: trivy-cve
        run: |
          set -euo pipefail
          mkdir -p security/reports
          MODE="${{ steps.resolve-dockerfile.outputs.mode }}"
          IMAGE_TAG="secure-gate-scan:${{ github.sha }}"

          if [ "$MODE" = "image" ]; then
            trivy image \
              --scanners vuln \
              --format json \
              --output security/reports/dependency-report.json \
              --exit-code 0 \
              --no-progress \
              "${IMAGE_TAG}"
          else
            trivy fs \
              --scanners vuln \
              --file-patterns "pip:requirements-legacy.txt" \
              --format json \
              --output security/reports/dependency-report.json \
              --exit-code 0 \
              --no-progress \
              .
          fi

      - name: Generate CycloneDX SBOM
        id: trivy-sbom
        run: |
          set -euo pipefail
          mkdir -p security/reports
          MODE="${{ steps.resolve-dockerfile.outputs.mode }}"
          IMAGE_TAG="secure-gate-scan:${{ github.sha }}"

          if [ "$MODE" = "image" ]; then
            trivy image \
              --format cyclonedx \
              --output security/reports/sbom.cdx.json \
              --no-progress \
              "${IMAGE_TAG}"
          else
            trivy fs \
              --file-patterns "pip:requirements-legacy.txt" \
              --format cyclonedx \
              --output security/reports/sbom.cdx.json \
              --no-progress \
              .
          fi

      - name: Pin CycloneDX specVersion to 1.6
        run: |
          python3 .secure-gate/scripts/pin-cyclonedx-specversion.py \
            --sbom security/reports/sbom.cdx.json \
            --spec-version 1.6

      - name: Validate Trivy CVE report
        run: |
          python3 -c 'import json; data=json.load(open("security/reports/dependency-report.json")); assert isinstance(data, dict); assert data.get("SchemaVersion") == 2'

      - name: Validate CycloneDX SBOM
        run: |
          python3 -c 'import json; d=json.load(open("security/reports/sbom.cdx.json")); assert d.get("bomFormat")=="CycloneDX"; assert d.get("specVersion")=="1.6"'

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: security/reports/dependency-report.json
          if-no-files-found: ignore

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: security/reports/sbom.cdx.json
          if-no-files-found: ignore

      - name: Upload SBOM to Dependency-Track
        id: dependency_track_upload
        continue-on-error: true
        env:
          DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .secure-gate/scripts/upload-sbom-to-dependency-track.py \
            --sbom security/reports/sbom.cdx.json \
            --repository "${{ github.repository }}" \
            --service-name "${{ inputs.dependency_track_service_name }}" \
            --project-version "${{ inputs.dependency_track_project_version }}" \
            --upload-mode "${{ inputs.dependency_track_upload_mode }}" \
            --report security/reports/dependency-track-upload-report.json

      - name: Ensure Dependency-Track upload report
        if: always()
        run: |
          set -euo pipefail
          REPORT="security/reports/dependency-track-upload-report.json"
          mkdir -p security/reports
          if [ ! -f "$REPORT" ]; then
            python3 -c 'import json,pathlib; p=pathlib.Path("security/reports/dependency-track-upload-report.json"); p.write_text(json.dumps({"status":"failed","reason":"report-missing","project_name":"","project_version":"","project_uuid":"","parent_name":"","service_name":"","upload_mode":"","created":False,"tool":"dependency-track","target":"bom-upload"}, indent=2)+"\n")'
          fi

      - name: Snapshot dependency-scan history
        id: dependency_scan_history
        if: always()
        run: |
          python3 .secure-gate/scripts/snapshot-dependency-scan-history.py \
            --reports-dir security/reports \
            --mode "${{ steps.resolve-dockerfile.outputs.mode }}" \
            --trivy-version "0.70.0" \
            --cyclonedx-spec "1.6"

      - name: Upload Dependency-Track upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-track-upload-report
          path: security/reports/dependency-track-upload-report.json

      - name: Upload dependency-scan history snapshot
        if: always() && steps.dependency_scan_history.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-history-${{ steps.dependency_scan_history.outputs.run_id }}
          path: ${{ steps.dependency_scan_history.outputs.path }}
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # 5. Runtime Validation - D파트 연결 예정
  # ──────────────────────────────────────────
  runtime-validation:
    name: Runtime Validation
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Set up Node.js
        if: inputs.install_command != '' || inputs.build_command != '' || inputs.start_command != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Build application
        if: inputs.build_command != ''
        run: ${{ inputs.build_command }}

      - name: Start application (runner-local)
        if: inputs.start_command != ''
        run: |
          set -euo pipefail
          ${{ inputs.start_command }} &
          echo $! > /tmp/secure-gate-app.pid
          TARGET="http://127.0.0.1:${{ inputs.app_port }}${{ inputs.health_path }}"
          echo "Waiting for app at ${TARGET}"
          for i in $(seq 1 30); do
            if curl -fsS "$TARGET" >/dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          exit 1

      - name: Resolve DAST target URL
        id: dast-target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.start_command }}" ]; then
            echo "url=http://127.0.0.1:${{ inputs.app_port }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify runtime target health
        if: inputs.enable_dast && steps.dast-target.outputs.url != ''
        run: |
          set -euo pipefail
          TARGET_URL="${{ steps.dast-target.outputs.url }}"
          HEALTH_URL="${TARGET_URL%/}${{ inputs.health_path }}"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
              echo "Runtime target is healthy: ${HEALTH_URL}"
              exit 0
            fi
            sleep 2
          done
          echo "Runtime target did not become healthy: ${HEALTH_URL}" >&2
          exit 1

      - name: Download dependency report for Nuclei
        if: inputs.enable_dast && steps.dast-target.outputs.url != ''
        uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: security/reports

      - name: Run ZAP PR validation
        if: inputs.enable_dast && steps.dast-target.outputs.url != ''
        run: |
          python3 .secure-gate/scripts/run-zap-validation.py \
            --profile pr \
            --target-url "${{ steps.dast-target.outputs.url }}" \
            --reports-dir security/reports

      - name: Run Nuclei PR validation
        if: inputs.enable_dast && steps.dast-target.outputs.url != ''
        run: |
          python3 .secure-gate/scripts/run-nuclei-validation.py \
            --profile pr \
            --target-url "${{ steps.dast-target.outputs.url }}" \
            --trivy-report security/reports/dependency-report.json \
            --reports-dir security/reports

      - name: Generate runtime validation report
        if: always()
        env:
          RUNTIME_REQUIRED_REPORTS: ${{ inputs.enable_dast && 'zap,nuclei,nuclei-coverage' || 'none' }}
        run: |
          python3 .secure-gate/scripts/runtime-validation.py \
            --base-url "${{ steps.dast-target.outputs.url }}" \
            --health-path "${{ inputs.health_path }}" \
            --output security/reports/runtime-report.json

      - name: Stop application
        if: always() && inputs.start_command != ''
        run: |
          if [ -f /tmp/secure-gate-app.pid ]; then
            kill "$(cat /tmp/secure-gate-app.pid)" 2>/dev/null || true
          fi

      - name: Upload runtime validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-report
          path: security/reports/runtime-report.json

      - name: Upload runtime scanner reports
        if: always() && inputs.enable_dast
        uses: actions/upload-artifact@v4
        with:
          name: runtime-scanner-reports
          path: |
            security/reports/zap-report.json
            security/reports/nuclei-report.jsonl
            security/reports/nuclei-cve-coverage.json
            security/reports/nuclei-cve-ids.txt
            security/reports/nuclei-cve-matched-templates.txt
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # 6. Aggregate & Gate Evaluation
  # ──────────────────────────────────────────
  aggregate-and-gate:
    name: Aggregate & Gate Evaluation
    runs-on: ubuntu-latest
    needs: [build-test, sast, secret-scan, dependency-scan, runtime-validation]
    if: always()
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Prepare aggregate report directory
        run: |
          mkdir -p security/reports
          rm -f \
            security/reports/build-report.json \
            security/reports/sast-report.json \
            security/reports/secret-report.json \
            security/reports/dependency-report.json \
            security/reports/runtime-report.json \
            security/reports/security-summary.json \
            security/reports/gate-decision.json

      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: security/reports
        continue-on-error: true

      - name: Download SAST report
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: security/reports
        continue-on-error: true

      - name: Download secret report
        uses: actions/download-artifact@v4
        with:
          name: secret-report
          path: security/reports
        continue-on-error: true

      - name: Download dependency report
        uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: security/reports
        continue-on-error: true

      - name: Download Dependency-Track upload report
        uses: actions/download-artifact@v4
        with:
          name: dependency-track-upload-report
          path: security/reports
        continue-on-error: true

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: security/reports
        continue-on-error: true

      - name: Download runtime report
        uses: actions/download-artifact@v4
        with:
          name: runtime-report
          path: security/reports
        continue-on-error: true

      - name: Record failed prerequisite jobs
        env:
          BUILD_RESULT: ${{ needs.build-test.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
          RUNTIME_RESULT: ${{ needs.runtime-validation.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = {
              "build": ("build-report.json", os.environ["BUILD_RESULT"]),
              "sast": ("sast-report.json", os.environ["SAST_RESULT"]),
              "secret-scan": ("secret-report.json", os.environ["SECRET_RESULT"]),
              "dependency-scan": (
                  "dependency-report.json",
                  os.environ["DEPENDENCY_RESULT"],
              ),
              "runtime-validation": (
                  "runtime-report.json",
                  os.environ["RUNTIME_RESULT"],
              ),
          }
          report_dir = Path("security/reports")
          for tool, (filename, result) in reports.items():
              if result == "success":
                  continue
              payload = {
                  "status": "error",
                  "tool": tool,
                  "findings": [],
                  "errors": [f"job-result-{result}"],
              }
              (report_dir / filename).write_text(
                  json.dumps(payload, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Resolve policy file
        id: policy
        run: |
          set -euo pipefail
          CALLER_POLICY="${{ inputs.policy_path }}"
          DEFAULT_POLICY=".secure-gate/security/policies/security-gate-policy.json"
          if [ -n "$CALLER_POLICY" ] && [ -f "$CALLER_POLICY" ]; then
            echo "path=${CALLER_POLICY}" >> "$GITHUB_OUTPUT"
          elif [ -f "security/policies/security-gate-policy.json" ]; then
            echo "path=security/policies/security-gate-policy.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=${DEFAULT_POLICY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Aggregator
        run: python .secure-gate/scripts/aggregate-results.py

      - name: Run CVE track (evidence)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p security/sbom/generated
          if [ ! -f security/reports/sbom.cdx.json ]; then
            echo "SBOM missing — skipping CVE track evidence generation"
            exit 0
          fi
          python3 .secure-gate/scripts/osv-query.py
          python3 .secure-gate/scripts/cve-risk-assess.py
          python3 .secure-gate/scripts/cve-policy-evaluate.py || true

      - name: Run Gate Evaluator
        id: gate-eval
        env:
          SECURE_GATE_POLICY: ${{ steps.policy.outputs.path }}
        run: python .secure-gate/scripts/evaluate-gate.py
        continue-on-error: true

      - name: Upload gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-decision
          path: |
            security/reports/security-summary.json
            security/reports/gate-decision.json
            security/reports/cve-policy-decision.json
            security/sbom/generated/

      - name: Enforce Gate
        if: steps.gate-eval.outcome == 'failure'
        run: |
          echo "Security Gate FAILED - Merge is blocked."
          exit 1

  # ──────────────────────────────────────────
  # 7. PR Comment
  # ──────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: aggregate-and-gate
    # PR이 아니면 댓글 대상이 없으므로 skip (push 스모크 등)
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Download gate decision
        uses: actions/download-artifact@v4
        with:
          name: gate-decision
          path: security/reports
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python .secure-gate/scripts/create-pr-comment.py
