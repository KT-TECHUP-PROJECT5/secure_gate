name: PR Security Gate

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  # ──────────────────────────────────────────
  # 1. Build / Test
  # ──────────────────────────────────────────
  build-test:
    name: Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Build and Test"
        run: |
          echo "Build and Test placeholder - replace with actual build/test commands"
          mkdir -p security/reports
          cat > security/reports/build-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "build-test",
            "findings": []
          }
          EOF

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: security/reports/build-report.json

  # ──────────────────────────────────────────
  # 2. SAST (Semgrep) - C파트
  # ──────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.168.0

      - name: Run Semgrep
        id: semgrep-scan
        continue-on-error: true
        run: |
          mkdir -p security/reports
          semgrep scan \
            --config auto \
            --config r/python.flask.security.xss.audit.template-unescaped-with-safe.template-unescaped-with-safe . \
            --json \
            --output security/reports/sast-report.json

      - name: Validate Semgrep report
        run: |
          python -c 'import json; data=json.load(open("security/reports/sast-report.json")); assert isinstance(data.get("results"), list); assert isinstance(data.get("errors"), list)'

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: security/reports/sast-report.json

  # ──────────────────────────────────────────
  # 3. Secret Scan (Gitleaks) - C파트
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        id: gitleaks-scan
        continue-on-error: true
        run: |
          mkdir -p security/reports
          gitleaks git . \
            --report-format json \
            --report-path security/reports/secret-report.json \
            --redact=100 \
            --exit-code 0 \
            --no-banner

      - name: Validate Gitleaks report
        run: |
          python3 -c 'import json; data=json.load(open("security/reports/secret-report.json")); assert isinstance(data, list)'

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-report
          path: security/reports/secret-report.json

  # ──────────────────────────────────────────
  # 4. Dependency Scan (Trivy) - C파트 연결 예정
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Dependency Scan"
        run: |
          echo "Dependency Scan placeholder - C파트의 Trivy 명령어로 교체 예정"
          mkdir -p security/reports
          cat > security/reports/dependency-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "trivy",
            "findings": []
          }
          EOF

      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: security/reports/dependency-report.json

  # ──────────────────────────────────────────
  # 5. Runtime Validation - D파트 연결 예정
  # ──────────────────────────────────────────
  runtime-validation:
    name: Runtime Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Runtime Validation"
        run: |
          echo "Runtime Validation placeholder - D파트와 연결 예정"
          mkdir -p security/reports
          cat > security/reports/runtime-report.json <<'EOF'
          {
            "status": "passed",
            "tool": "runtime-validation",
            "findings": []
          }
          EOF

      - name: Upload runtime validation report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-report
          path: security/reports/runtime-report.json

  # ──────────────────────────────────────────
  # 6. Aggregate & Gate Evaluation
  # ──────────────────────────────────────────
  aggregate-and-gate:
    name: Aggregate & Gate Evaluation
    runs-on: ubuntu-latest
    needs: [build-test, sast, secret-scan, dependency-scan, runtime-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Aggregator
        run: python scripts/aggregate-results.py

      - name: Run Gate Evaluator
        id: gate-eval
        run: python scripts/evaluate-gate.py
        continue-on-error: true

      - name: Upload gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-decision
          path: |
            security/reports/security-summary.json
            security/reports/gate-decision.json

      - name: Enforce Gate
        if: steps.gate-eval.outcome == 'failure'
        run: |
          echo "Security Gate FAILED - Merge is blocked."
          exit 1

  # ──────────────────────────────────────────
  # 7. PR Comment
  # ──────────────────────────────────────────
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: aggregate-and-gate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download gate decision
        uses: actions/download-artifact@v4
        with:
          name: gate-decision
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/create-pr-comment.py
