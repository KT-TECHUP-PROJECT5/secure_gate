name: CD - Staging Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # 1. Docker Build - 4차 구현에서 실제 연결 예정
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Docker Build"
        run: |
          echo "Docker Build placeholder"
          echo "Image tag: staging-${{ github.sha }}"
          echo "Image tag: latest"
          echo "Dockerfile 위치 및 빌드 명령어는 4차 구현에서 확정 예정"

  # ──────────────────────────────────────────
  # 2. Staging Deploy - 4차 구현에서 실제 연결 예정
  # ──────────────────────────────────────────
  staging-deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Staging Deploy"
        run: |
          echo "Staging Deploy placeholder"
          echo "배포 방식 (EC2 / Docker Compose / Cloud) 확정 후 실제 배포 명령어로 교체 예정"

  # ──────────────────────────────────────────
  # 3. Post-deploy Runtime Validation
  # ──────────────────────────────────────────
  post-deploy-validation:
    name: Post-deploy Validation
    needs: staging-deploy
    uses: ./.github/workflows/post-merge-security-gate.yml
    with:
      gate_repository: ${{ github.repository }}
      gate_ref: ${{ github.sha }}
      target_url: ${{ vars.STAGING_URL }}
      health_path: /posts
      smoke_paths: /login=200,/posts=200,/upload=200|303,/docs=200,/redoc=200
      dynatrace_environment_url: ${{ vars.DYNATRACE_ENV_URL }}
    secrets: inherit
