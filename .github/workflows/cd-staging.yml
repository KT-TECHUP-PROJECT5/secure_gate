name: CD - Staging Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # 1. Docker Build - 4차 구현에서 실제 연결 예정
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Docker Build"
        run: |
          echo "Docker Build placeholder"
          echo "Image tag: staging-${{ github.sha }}"
          echo "Image tag: latest"
          echo "Dockerfile 위치 및 빌드 명령어는 4차 구현에서 확정 예정"

  # ──────────────────────────────────────────
  # 2. Staging Deploy - 4차 구현에서 실제 연결 예정
  # ──────────────────────────────────────────
  staging-deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: "[Placeholder] Staging Deploy"
        run: |
          echo "Staging Deploy placeholder"
          echo "배포 방식 (EC2 / Docker Compose / Cloud) 확정 후 실제 배포 명령어로 교체 예정"

  # ──────────────────────────────────────────
  # 3. Post-deploy Validation - D파트
  # ──────────────────────────────────────────
  post-deploy-validation:
    name: Post-deploy Validation
    runs-on: ubuntu-latest
    needs: staging-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Run Post-deploy ZAP Baseline
        env:
          ZAP_TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          TARGET_URL="${ZAP_TARGET_URL:-$STAGING_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "ZAP_TARGET_URL/STAGING_URL is not set. Skipping ZAP baseline."
            exit 0
          fi

          mkdir -p security/reports
          docker run --rm \
            -v "${{ github.workspace }}/security/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$TARGET_URL" \
            -J zap-report.json || true

      - name: Run Post-deploy Runtime Validation
        env:
          RUNTIME_BASE_URL: ${{ vars.STAGING_URL }}
          HEALTH_CHECK_PATH: ${{ vars.HEALTH_CHECK_PATH }}
          HEALTH_EXPECTED_STATUS: ${{ vars.HEALTH_EXPECTED_STATUS }}
          SMOKE_TEST_PATHS: ${{ vars.SMOKE_TEST_PATHS }}
          REQUIRED_SECURITY_HEADERS: ${{ vars.REQUIRED_SECURITY_HEADERS }}
          ZAP_REPORT_PATH: security/reports/zap-report.json
        run: python scripts/runtime-validation.py

      - name: Upload post-deploy runtime validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-runtime-report
          path: security/reports/runtime-report.json
