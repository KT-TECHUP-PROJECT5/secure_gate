name: Post-merge Security Gate

on:
  workflow_call:
    inputs:
      gate_repository:
        description: Secure Gate tooling repository
        type: string
        required: false
        default: "KT-TECHUP-PROJECT5/secure_gate"
      gate_ref:
        description: Secure Gate tooling ref
        type: string
        required: false
        default: "v1"
      target_url:
        description: Deployed staging URL to validate
        type: string
        required: true
      scan_path:
        description: DAST entry path appended to target_url
        type: string
        required: false
        default: "/"
      health_path:
        description: Health endpoint path
        type: string
        required: false
        default: "/health"
      health_expected_status:
        description: Expected HTTP status for the health endpoint
        type: string
        required: false
        default: "200"
      smoke_paths:
        description: Comma-separated smoke paths with optional expected status
        type: string
        required: false
        default: "/"
      required_headers:
        description: Required response headers, or none to disable
        type: string
        required: false
        default: "x-content-type-options,x-frame-options,content-security-policy"
      custom_checks:
        description: Runtime custom checks, or none to disable
        type: string
        required: false
        default: "none"
      custom_username:
        description: Username for authenticated custom runtime checks
        type: string
        required: false
        default: ""
      custom_login_verify_path:
        description: Path used to verify the authenticated custom-check session
        type: string
        required: false
        default: "/posts"
      custom_logged_in_markers:
        description: Comma-separated response markers proving login success
        type: string
        required: false
        default: "로그아웃,/logout"
      zap_auth_plan:
        description: Optional authenticated ZAP Automation Framework plan
        type: string
        required: false
        default: ""
      zap_auth_username:
        description: Username for the authenticated ZAP user
        type: string
        required: false
        default: ""
      dockerfile_path:
        description: Dockerfile path for the post-merge dependency scan
        type: string
        required: false
        default: ""
      docker_build_context:
        description: Docker build context for the post-merge dependency scan
        type: string
        required: false
        default: "."
      dependency_track_service_name:
        description: Optional Dependency-Track child service name
        type: string
        required: false
        default: ""
      dependency_track_project_version:
        description: Dependency-Track project version
        type: string
        required: false
        default: "main"
      dynatrace_environment_url:
        description: Dynatrace SaaS environment URL
        type: string
        required: true
      dynatrace_problem_selector:
        description: Dynatrace Problems API selector
        type: string
        required: true
      dynatrace_entity_selector:
        description: Application-scoped entity selector for Dynatrace problems
        type: string
        required: true
      dynatrace_service_entity_selector:
        description: Application-scoped Dynatrace service entity selector
        type: string
        required: true
      policy_path:
        description: Policy path in caller repository; empty uses Secure Gate default
        type: string
        required: false
        default: ""
    secrets:
      DEPENDENCY_TRACK_URL:
        description: Dependency-Track base URL
        required: true
      DEPENDENCY_TRACK_API_KEY:
        description: Dependency-Track API key
        required: true
      DYNATRACE_TOKEN:
        description: Dynatrace token with problems.read and entities.read
        required: true
      ZAP_AUTH_PASSWORD:
        description: Password for the authenticated ZAP user
        required: false
      CUSTOM_RUNTIME_PASSWORD:
        description: Password for authenticated custom runtime checks
        required: false
      OPENAI_API_KEY:
        description: Optional OpenAI API key for the non-authoritative AI report
        required: false
      DISCORD_WEBHOOK_URL:
        description: Discord incoming webhook URL for hard-gate summary (optional)
        required: false

jobs:
  post-merge-dependency:
    name: Post-merge Dependency Scan and SBOM Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.70.0"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

      - name: Resolve Dockerfile and scan mode
        id: resolve-dockerfile
        env:
          INPUT_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.docker_build_context }}
        run: |
          set -euo pipefail
          DOCKERFILE=""
          if [ -n "$INPUT_PATH" ]; then
            if [ ! -f "$INPUT_PATH" ]; then
              echo "dockerfile_path was set but file not found: $INPUT_PATH" >&2
              exit 1
            fi
            DOCKERFILE="$INPUT_PATH"
          elif [ -f Dockerfile ]; then
            DOCKERFILE="Dockerfile"
          elif [ -f dockerfile ]; then
            DOCKERFILE="dockerfile"
          fi

          MODE="fs"
          if [ -n "$DOCKERFILE" ]; then
            MODE="image"
          fi
          {
            echo "dockerfile=$DOCKERFILE"
            echo "context=$BUILD_CONTEXT"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for Trivy
        if: steps.resolve-dockerfile.outputs.mode == 'image'
        run: |
          docker build \
            -f "${{ steps.resolve-dockerfile.outputs.dockerfile }}" \
            -t "secure-gate-scan:${{ github.sha }}" \
            "${{ steps.resolve-dockerfile.outputs.context }}"

      - name: Generate Trivy CVE report and CycloneDX SBOM
        env:
          SCAN_MODE: ${{ steps.resolve-dockerfile.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p security/reports
          if [ "$SCAN_MODE" = "image" ]; then
            TARGET="secure-gate-scan:${{ github.sha }}"
            trivy image --scanners vuln --format json \
              --output security/reports/dependency-report.json \
              --exit-code 0 --no-progress "$TARGET"
            trivy image --format cyclonedx \
              --output security/reports/sbom.cdx.json \
              --no-progress "$TARGET"
          else
            trivy fs --scanners vuln \
              --file-patterns "pip:requirements-legacy.txt" \
              --format json \
              --output security/reports/dependency-report.json \
              --exit-code 0 --no-progress .
            trivy fs \
              --file-patterns "pip:requirements-legacy.txt" \
              --format cyclonedx \
              --output security/reports/sbom.cdx.json \
              --no-progress .
          fi

      - name: Validate dependency reports
        run: |
          python3 .secure-gate/scripts/pin-cyclonedx-specversion.py \
            --sbom security/reports/sbom.cdx.json \
            --spec-version 1.6
          python3 -c 'import json; d=json.load(open("security/reports/dependency-report.json")); assert d.get("SchemaVersion") == 2'
          python3 -c 'import json; d=json.load(open("security/reports/sbom.cdx.json")); assert d.get("bomFormat") == "CycloneDX" and d.get("specVersion") == "1.6"'

      - name: Upload SBOM to Dependency-Track
        env:
          DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          python3 .secure-gate/scripts/upload-sbom-to-dependency-track.py \
            --sbom security/reports/sbom.cdx.json \
            --repository "${{ github.repository }}" \
            --service-name "${{ inputs.dependency_track_service_name }}" \
            --project-version "${{ inputs.dependency_track_project_version }}" \
            --upload-mode always \
            --report security/reports/dependency-track-upload-report.json

      - name: Ensure Dependency-Track upload report
        if: always()
        run: |
          REPORT="security/reports/dependency-track-upload-report.json"
          if [ ! -f "$REPORT" ]; then
            mkdir -p security/reports
            python3 -c 'import json,pathlib; p=pathlib.Path("security/reports/dependency-track-upload-report.json"); p.write_text(json.dumps({"status":"failed","reason":"report-missing","tool":"dependency-track","target":"bom-upload"}, indent=2)+"\n")'
          fi

      - name: Upload post-merge dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-dependency-reports
          path: |
            security/reports/dependency-report.json
            security/reports/sbom.cdx.json
            security/reports/dependency-track-upload-report.json
          if-no-files-found: warn

  post-merge-runtime:
    name: Post-merge Runtime Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Prepare runtime reports
        run: |
          set -euo pipefail
          mkdir -p security/reports
          rm -f \
            security/reports/zap-report.json \
            security/reports/nuclei-report.jsonl \
            security/reports/nuclei-cve-coverage.json \
            security/reports/nuclei-cve-ids.txt \
            security/reports/nuclei-cve-matched-templates.txt \
            security/reports/dynatrace-problems.json \
            security/reports/runtime-report.json \
            security/reports/security-summary.json \
            security/reports/gate-decision.json

      - name: Validate post-merge configuration
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ZAP_AUTH_PLAN: ${{ inputs.zap_auth_plan }}
          ZAP_AUTH_USERNAME: ${{ inputs.zap_auth_username }}
          ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_AUTH_PASSWORD }}
          CUSTOM_CHECKS: ${{ inputs.custom_checks }}
          CUSTOM_RUNTIME_USERNAME: ${{ inputs.custom_username }}
          CUSTOM_RUNTIME_PASSWORD: ${{ secrets.CUSTOM_RUNTIME_PASSWORD }}
          DYNATRACE_ENV_URL: ${{ inputs.dynatrace_environment_url }}
          DYNATRACE_PROBLEM_SELECTOR: ${{ inputs.dynatrace_problem_selector }}
          DYNATRACE_ENTITY_SELECTOR: ${{ inputs.dynatrace_entity_selector }}
          DYNATRACE_SERVICE_ENTITY_SELECTOR: ${{ inputs.dynatrace_service_entity_selector }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          required = {
              "target_url": os.environ["TARGET_URL"],
              "dynatrace_environment_url": os.environ["DYNATRACE_ENV_URL"],
              "dynatrace_problem_selector": os.environ["DYNATRACE_PROBLEM_SELECTOR"],
              "dynatrace_entity_selector": os.environ["DYNATRACE_ENTITY_SELECTOR"],
              "dynatrace_service_entity_selector": os.environ[
                  "DYNATRACE_SERVICE_ENTITY_SELECTOR"
              ],
          }
          missing = [name for name, value in required.items() if not value.strip()]
          if missing:
              print(
                  f"[ERROR] Required post-merge inputs are empty: {', '.join(missing)}",
                  file=sys.stderr,
              )
              raise SystemExit(2)

          global_selector = 'type("SERVICE")'
          for name in (
              "dynatrace_entity_selector",
              "dynatrace_service_entity_selector",
          ):
              if required[name].replace(" ", "").upper() == global_selector.upper():
                  print(
                      f"[ERROR] {name} must identify this application, not every service",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)

          auth_plan = os.environ["ZAP_AUTH_PLAN"].strip()
          if auth_plan:
              missing_auth = [
                  name
                  for name in ("ZAP_AUTH_USERNAME", "ZAP_AUTH_PASSWORD")
                  if not os.environ[name].strip()
              ]
              if missing_auth:
                  print(
                      "[ERROR] Authenticated ZAP requires: "
                      + ", ".join(missing_auth),
                      file=sys.stderr,
                  )
                  raise SystemExit(2)

          custom_checks = {
              value.strip()
              for value in os.environ["CUSTOM_CHECKS"].split(",")
              if value.strip()
          }
          if custom_checks.intersection({"admin-access", "idor"}):
              missing_custom_auth = [
                  name
                  for name in (
                      "CUSTOM_RUNTIME_USERNAME",
                      "CUSTOM_RUNTIME_PASSWORD",
                  )
                  if not os.environ[name].strip()
              ]
              if missing_custom_auth:
                  print(
                      "[ERROR] Authenticated custom checks require: "
                      + ", ".join(missing_custom_auth),
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
          PY

      - name: Resolve runtime scan URL
        id: runtime-target
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          set -euo pipefail
          BASE_URL="${TARGET_URL%/}"
          case "$SCAN_PATH" in
            http://*|https://*)
              SCAN_URL="$SCAN_PATH"
              ;;
            /*)
              SCAN_URL="${BASE_URL}${SCAN_PATH}"
              ;;
            *)
              SCAN_URL="${BASE_URL}/${SCAN_PATH}"
              ;;
          esac
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "scan_url=$SCAN_URL" >> "$GITHUB_OUTPUT"
          echo "Runtime base URL: $BASE_URL"
          echo "DAST scan URL: $SCAN_URL"

      - name: Verify staging health
        id: staging-health
        env:
          TARGET_URL: ${{ steps.runtime-target.outputs.base_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
          HEALTH_EXPECTED_STATUS: ${{ inputs.health_expected_status }}
        run: |
          set -euo pipefail
          HEALTH_URL="${TARGET_URL%/}${HEALTH_PATH}"
          for _ in $(seq 1 30); do
            STATUS="$(
              curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' "$HEALTH_URL" || true
            )"
            if [ "$STATUS" = "$HEALTH_EXPECTED_STATUS" ]; then
              echo "Staging is healthy: ${HEALTH_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not become healthy: ${HEALTH_URL}" >&2
          exit 1

      - name: Run ZAP post-merge validation
        if: steps.staging-health.outcome == 'success'
        env:
          TARGET_URL: ${{ steps.runtime-target.outputs.scan_url }}
          ZAP_AUTH_PLAN: ${{ inputs.zap_auth_plan }}
          ZAP_AUTH_CONTEXT_URL: ${{ steps.runtime-target.outputs.base_url }}
          ZAP_AUTH_USERNAME: ${{ inputs.zap_auth_username }}
          ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_AUTH_PASSWORD }}
        run: |
          python3 .secure-gate/scripts/run-zap-validation.py \
            --profile post-merge \
            --target-url "$TARGET_URL" \
            --reports-dir security/reports

      - name: Run Nuclei post-merge validation
        if: always() && steps.staging-health.outcome == 'success'
        env:
          TARGET_URL: ${{ steps.runtime-target.outputs.scan_url }}
        run: |
          python3 .secure-gate/scripts/run-nuclei-validation.py \
            --profile post-merge \
            --target-url "$TARGET_URL" \
            --reports-dir security/reports

      - name: Fetch Dynatrace runtime results
        if: always()
        env:
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_TOKEN }}
          DYNATRACE_ENV_URL: ${{ inputs.dynatrace_environment_url }}
          DYNATRACE_PROBLEM_SELECTOR: ${{ inputs.dynatrace_problem_selector }}
          DYNATRACE_ENTITY_SELECTOR: ${{ inputs.dynatrace_entity_selector }}
          DYNATRACE_SERVICE_ENTITY_SELECTOR: ${{ inputs.dynatrace_service_entity_selector }}
        run: |
          python3 .secure-gate/scripts/fetch-dynatrace-problems.py \
            --output security/reports/dynatrace-problems.json

      - name: Generate and enforce runtime validation report
        if: always()
        env:
          TARGET_URL: ${{ steps.runtime-target.outputs.base_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
          HEALTH_EXPECTED_STATUS: ${{ inputs.health_expected_status }}
          SMOKE_PATHS: ${{ inputs.smoke_paths }}
          REQUIRED_HEADERS: ${{ inputs.required_headers }}
          CUSTOM_CHECKS: ${{ inputs.custom_checks }}
          CUSTOM_RUNTIME_USERNAME: ${{ inputs.custom_username }}
          CUSTOM_RUNTIME_PASSWORD: ${{ secrets.CUSTOM_RUNTIME_PASSWORD }}
          CUSTOM_RUNTIME_LOGIN_VERIFY_PATH: ${{ inputs.custom_login_verify_path }}
          CUSTOM_RUNTIME_LOGGED_IN_MARKERS: ${{ inputs.custom_logged_in_markers }}
        run: |
          python3 .secure-gate/scripts/runtime-validation.py \
            --base-url "$TARGET_URL" \
            --health-path "$HEALTH_PATH" \
            --health-expected-status "$HEALTH_EXPECTED_STATUS" \
            --smoke-paths "$SMOKE_PATHS" \
            --required-headers "$REQUIRED_HEADERS" \
            --custom-checks "$CUSTOM_CHECKS" \
            --required-reports "zap,nuclei,nuclei-coverage,dynatrace" \
            --output security/reports/runtime-report.json \
            --fail-on-failed

      - name: Upload post-merge runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-runtime-reports
          path: |
            security/reports/zap-report.json
            security/reports/nuclei-report.jsonl
            security/reports/nuclei-cve-coverage.json
            security/reports/nuclei-cve-ids.txt
            security/reports/nuclei-cve-matched-templates.txt
            security/reports/dynatrace-problems.json
            security/reports/runtime-report.json
          if-no-files-found: warn

  aggregate-and-gate:
    name: Aggregate and Enforce Post-merge Gate
    if: always()
    needs:
      - post-merge-dependency
      - post-merge-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout Secure Gate tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gate_repository }}
          ref: ${{ inputs.gate_ref }}
          path: .secure-gate

      - name: Prepare aggregate report directory
        run: mkdir -p security/reports

      - name: Download post-merge dependency reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-dependency-reports
          path: security/reports

      - name: Download post-merge runtime reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: post-merge-runtime-reports
          path: security/reports

      - name: Aggregate post-merge results
        env:
          # Post-merge requires a real DT upload; intentional skips must fail-closed.
          SECURE_GATE_REQUIRE_DT_UPLOAD: "true"
        run: |
          python3 .secure-gate/scripts/aggregate-results.py \
            --reports dependency_scan,dependency_track,runtime_validation

      - name: Run CVE track (evidence)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p security/sbom/generated
          if [ ! -f security/reports/sbom.cdx.json ]; then
            echo "SBOM missing — skipping CVE track evidence generation"
            exit 0
          fi
          python3 .secure-gate/scripts/osv-query.py
          python3 .secure-gate/scripts/cve-risk-assess.py
          python3 .secure-gate/scripts/cve-policy-evaluate.py || true

      - name: Resolve policy file
        id: policy
        env:
          CALLER_POLICY: ${{ inputs.policy_path }}
        run: |
          set -euo pipefail
          if [ -n "$CALLER_POLICY" ] && [ -f "$CALLER_POLICY" ]; then
            echo "path=${CALLER_POLICY}" >> "$GITHUB_OUTPUT"
          elif [ -f "security/policies/security-gate-policy.json" ]; then
            echo "path=security/policies/security-gate-policy.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=.secure-gate/security/policies/security-gate-policy.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate post-merge policy
        id: gate-eval
        env:
          SECURE_GATE_POLICY: ${{ steps.policy.outputs.path }}
        run: python3 .secure-gate/scripts/evaluate-gate.py
        continue-on-error: true

      - name: Generate post-merge AI security summary
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .secure-gate/scripts/generate-ai-security-summary.py

      - name: Upload post-merge gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-gate-results
          path: |
            security/reports/dependency-report.json
            security/reports/sbom.cdx.json
            security/reports/dependency-track-upload-report.json
            security/reports/runtime-report.json
            security/reports/security-summary.json
            security/reports/gate-decision.json
            security/reports/cve-policy-decision.json
            security/reports/ai-security-summary.json
            security/reports/ai-security-summary.md
            security/sbom/generated/
          if-no-files-found: warn

      - name: Notify Discord (summary)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GATE_DECISION_FILE: security/reports/gate-decision.json
          NOTIFY_PROFILE: hard
          # Optional dedicated AI report URL; falls back to Actions run page.
          AI_REPORT_URL: ${{ vars.AI_REPORT_URL }}
        run: python3 .secure-gate/scripts/notify-discord.py
        continue-on-error: true

      - name: Enforce post-merge gate
        if: steps.gate-eval.outcome == 'failure'
        run: |
          echo "Post-merge Security Gate FAILED."
          exit 1
