---
env:
  contexts:
    - name: secure-gate-authenticated
      urls:
        - ${ZAP_TARGET_URL}
      includePaths:
        - ${ZAP_CONTEXT_URL}/.*
      excludePaths:
        - ${ZAP_CONTEXT_URL}/logout.*
      authentication:
        method: form
        parameters:
          loginPageUrl: ${ZAP_CONTEXT_URL}/login
          loginRequestUrl: ${ZAP_CONTEXT_URL}/login
          loginRequestBody: "username={%username%}&password={%password%}"
        verification:
          method: response
          loggedInRegex: "(?i)(/logout|로그아웃)"
          loggedOutRegex: "(?i)(/login|로그인)"
      sessionManagement:
        method: cookie
        parameters: {}
      users:
        - name: secure-gate-user
          credentials:
            username: ${ZAP_AUTH_USERNAME}
            password: ${ZAP_AUTH_PASSWORD}
  parameters:
    failOnError: true
    failOnWarning: true
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: secure-gate-authenticated
      user: secure-gate-user
      url: ${ZAP_TARGET_URL}
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: activeScan
    parameters:
      context: secure-gate-authenticated
      user: secure-gate-user
      url: ${ZAP_TARGET_URL}

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json
      reportTitle: Secure Gate Authenticated ZAP Report
      displayReport: false
