name: Post-merge Security Gate

# "Deploy Staging"을 실제 배포 Workflow의 name 값으로 변경한다.
on:
  workflow_run:
    workflows:
      - Deploy Staging
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-merge-security-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    uses: KT-TECHUP-PROJECT5/secure_gate/.github/workflows/post-merge-security-gate.yml@v1
    with:
      gate_repository: KT-TECHUP-PROJECT5/secure_gate
      gate_ref: v1
      target_url: ${{ vars.STAGING_URL }}
      scan_path: ${{ vars.DAST_SCAN_PATH || '/' }}
      health_path: ${{ vars.HEALTH_CHECK_PATH || '/health' }}
      health_expected_status: ${{ vars.HEALTH_EXPECTED_STATUS || '200' }}
      smoke_paths: ${{ vars.SMOKE_TEST_PATHS || '/' }}
      custom_checks: ${{ vars.CUSTOM_RUNTIME_CHECKS || 'none' }}
      custom_username: ${{ vars.CUSTOM_RUNTIME_USERNAME || '' }}
      custom_login_verify_path: ${{ vars.CUSTOM_RUNTIME_LOGIN_VERIFY_PATH || '/posts' }}
      custom_logged_in_markers: ${{ vars.CUSTOM_RUNTIME_LOGGED_IN_MARKERS || '로그아웃,/logout' }}
      zap_auth_plan: ${{ vars.ZAP_AUTH_PLAN || '' }}
      zap_auth_username: ${{ vars.ZAP_AUTH_USERNAME || '' }}
      dynatrace_environment_url: ${{ vars.DYNATRACE_ENV_URL }}
      dynatrace_problem_selector: ${{ vars.DYNATRACE_PROBLEM_SELECTOR }}
      dynatrace_entity_selector: ${{ vars.DYNATRACE_ENTITY_SELECTOR }}
      dynatrace_service_entity_selector: ${{ vars.DYNATRACE_SERVICE_ENTITY_SELECTOR }}
    secrets:
      DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      DYNATRACE_TOKEN: ${{ secrets.DYNATRACE_TOKEN }}
      ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_AUTH_PASSWORD }}
      CUSTOM_RUNTIME_PASSWORD: ${{ secrets.CUSTOM_RUNTIME_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
